spring:
  application:
    name: finledger-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/finledger}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

finledger:
  jwt:
    secret: ${JWT_SECRET:finledger_vn_personal_finance_jwt_secret_key_2026_production_grade_hmac256}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  ai:
    enabled: ${FINLEDGER_AI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
  webhook:
    api-key: ${WEBHOOK_API_KEY:finledger_secret_webhook_key_2026}
    signature-secret: ${WEBHOOK_SIGNATURE_SECRET:finledger_hmac_secret_2026}

server:
  port: 8080

logging:
  level:
    root: INFO
    vn.finledger: DEBUG
