version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finledger-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finledger}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-finledger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finledger-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr-worker:
    build:
      context: ../ocr-worker
      dockerfile: Dockerfile
    container_name: finledger-ocr-worker
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT=0
      - FLAGS_use_onednn=0
      - FLAGS_enable_pir_api=0

volumes:
  postgres_data:
  redis_data:
