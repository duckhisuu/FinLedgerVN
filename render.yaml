databases:
  - name: finledger-db
    databaseName: finledger
    user: finledger
    plan: free

services:
  - type: keyvalue
    name: finledger-redis
    plan: free
    ipAllowList: []

  - type: web
    name: finledger-ocr-worker
    runtime: docker
    rootDir: ocr-worker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "8081"
      - key: PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT
        value: "0"
      - key: FLAGS_use_onednn
        value: "0"
      - key: FLAGS_enable_pir_api
        value: "0"

  - type: web
    name: finledger-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/public/health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: finledger-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: finledger-redis
          property: connectionString
      - key: OCR_WORKER_URL
        fromService:
          type: web
          name: finledger-ocr-worker
          property: url
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_API_KEY
        generateValue: true
      - key: WEBHOOK_SIGNATURE_SECRET
        generateValue: true
      - key: JAVA_OPTS
        value: "-Xmx384m -Xms128m"

  - type: web
    name: finledger-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: finledger-backend
          property: url
